<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F9">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Tu asesora de imagen personal en el bolsillo.">
  <title>Mi Asesora</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Asesora">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-fila">
      <p class="marca">Mi Asesora</p>
      <button type="button" class="boton-instalar" id="boton-instalar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Instalar app
      </button>
    </div>
    <h1 id="titulo-pantalla">Mi perfil</h1>
  </header>

  <main id="contenido" class="contenido"></main>

  <nav class="menu" aria-label="Secciones">
    <a href="#perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Perfil
    </a>
    <a href="#objetivos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/></svg>
      Objetivos
    </a>
    <a href="#closet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.5a2 2 0 1 1 2-2c0 1.2-2 1.6-2 3.2"/><path d="M12 8.7 3 15.5c-.8.6-.4 1.8.6 1.8h16.8c1 0 1.4-1.2.6-1.8L12 8.7z"/></svg>
      Clóset
    </a>
    <a href="#probador">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 4 3.5 13h-11L10 7 9 3z"/><path d="M10 7h4"/></svg>
      Probador
    </a>
    <a href="#asesora">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg>
      Asesora
    </a>
    <a href="#outfit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Mi día
    </a>
  </nav>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
